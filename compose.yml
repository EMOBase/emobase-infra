name: emobase-infra

# Per-server infrastructure for EMOBase deployments.
#
# Run one of these stacks on every server that hosts the portal and/or species.
# It runs the services that every local portal/species deployment uses:
#   * MySQL           - databases for the portal, Keycloak and Directus
#   * Keycloak        - the shared portal realm plus optional species realms
#   * Elasticsearch   - one index store for the portal and every species
#
# The deploy stacks (emobase-portal-deploy and emobase-deploy) join the
# external network below and reach MySQL/Keycloak/Elasticsearch by their
# service names. Keycloak also has its own browser-facing endpoint at
# KEYCLOAK_PUBLIC_URL, so species authentication does not depend on the portal.
#
# Elasticsearch is never published on the LAN. It listens on the shared Docker
# network as `elasticsearch:9200`; the loopback-only host port below is for
# administration and backup. Species stacks reach it through their own
# `es-proxy` sidecar so the application services stay off this network.
# The proxy is network isolation, not authorization: anything on a species
# network can reach every index in this shared instance. Index prefixes keep
# species data apart, not secret from each other.

services:
  mysql:
    image: mysql:8.0
    container_name: emobase-infra-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Allow the portal/species containers to connect as root over the
      # shared Docker network.
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 10s
      retries: 18
    networks:
      emobase-infra:
        aliases:
          - mysql

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: emobase-infra-keycloak
    restart: unless-stopped
    command: ["start", "--health-enabled=true"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Keycloak has its own per-server public URL. The portal does not proxy
      # it, so species authentication does not depend on the portal.
      KC_HOSTNAME_URL: ${KEYCLOAK_PUBLIC_URL}/
      KC_HOSTNAME_ADMIN_URL: ${KEYCLOAK_PUBLIC_URL}/
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_RELATIVE_PATH: /keycloak/
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_DB: mysql
      KC_DB_URL_HOST: mysql
      KC_DB_URL_PORT: 3306
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      KC_DB_SCHEMA: keycloak
      JAVA_OPTS: ${KEYCLOAK_JAVA_OPTS:--Xms256m -Xmx768m}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /keycloak/health/ready HTTP/1.0\r\n\r\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 10s
      retries: 18
    ports:
      # Browser-facing Keycloak. Put a TLS reverse proxy in front in production
      # and keep KEYCLOAK_PUBLIC_URL on the public URL.
      - "${KEYCLOAK_HOST_PORT:-8181}:8080"
    networks:
      emobase-infra:
        aliases:
          - keycloak

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    container_name: emobase-infra-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      # Snapshot repository inside the container. The bind mount below is the
      # only host-side copy an operator needs to back up.
      path.repo: /es-bk
    mem_limit: ${ELASTICSEARCH_MEM_LIMIT:-1g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./es_bk:/es-bk
    ports:
      # Loopback-only administration and backup port. Applications use the
      # shared network name `elasticsearch`, never this host port.
      - "127.0.0.1:${ELASTICSEARCH_HOST_PORT:-9202}:9200"
    healthcheck:
      # Queries the HTTP listener, so a healthy container is also accepting
      # requests from the deploy stacks.
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
    networks:
      emobase-infra:
        aliases:
          - elasticsearch

volumes:
  mysql-data:
  es-data:

networks:
  emobase-infra:
    # The deploy stacks declare this network as external and must use the same
    # name (EMOBASE_INFRA_NETWORK).
    name: ${EMOBASE_INFRA_NETWORK:-emobase-infra}
